<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Nota Azul - Assistente Virtual</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #e1f5fe);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .chat-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 700px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #b3e5fc;
    }

    .chat-header {
      background-color: #29b6f6;
      padding: 16px;
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid white;
    }

    .chat-header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    #chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: #f0f8ff;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 75%;
      margin: 8px 0;
      padding: 12px 16px;
      border-radius: 18px;
      position: relative;
      line-height: 1.5;
      font-size: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.06);
    }

    .user-message {
      background: #d0f0c0;
      align-self: flex-end;
      text-align: right;
      border-bottom-right-radius: 4px;
    }

    .bot-message {
      background: #ffffff;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .input-area {
      display: flex;
      border-top: 1px solid #ddd;
      background-color: #fafafa;
    }

    #user-input {
      flex: 1;
      padding: 14px;
      border: none;
      font-size: 16px;
      outline: none;
    }

    #send-button {
      background: #29b6f6;
      color: white;
      padding: 0 22px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    #send-button:hover {
      background: #0288d1;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background-color: #90caf9;
      border-radius: 20px;
    }

    .typing {
      font-style: italic;
      color: #777;
    }

    .suggestions {
      padding: 10px;
      background: #e1f5fe;
      text-align: center;
    }

    .suggestions button {
      margin: 4px;
      padding: 6px 10px;
      border: none;
      background: #29b6f6;
      color: white;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <img src="https://cdn-icons-png.flaticon.com/512/4712/4712035.png" alt="Azulzinho">
    <h1>Azulzinho - Nota Azul 🤖</h1>
  </div>

  <div id="chat-box"></div>

  <div class="suggestions">
    <button onclick="sugerir('o que é o nota azul')">O que é?</button>
    <button onclick="sugerir('benefícios')">Benefícios</button>
    <button onclick="sugerir('como funciona')">Como funciona</button>
  </div>

  <div class="input-area">
    <input type="text" id="user-input" placeholder="Digite aqui sua pergunta..." autocomplete="off">
    <button id="send-button">Enviar</button>
  </div>
</div>

<script>
    const respostasNotaAzul = [
      {
        palavrasChave: ["o que é", "sobre", "nota azul", "explica"],
        respostas: [
          "Claro! O Nota Azul é um projeto que recompensa bons alunos com benefícios em comércios locais. Um jeito incrível de unir educação e incentivo!",
          "O Nota Azul conecta boas notas com vantagens. É como trocar dedicação por prêmios!",
          "É uma ponte entre educação e oportunidade! Estudantes que mandam bem na escola podem ganhar benefícios nos comércios parceiros."
        ]
      },
      {
        palavrasChave: ["como funciona", "funciona", "participa", "mecanismo"],
        respostas: [
          "Você estuda, tira boas notas e apresenta no comércio parceiro. Simples assim: esforço vira recompensa!",
          "Funciona de forma prática: boas notas valem prêmios! Basta estar cadastrado e apresentar o desempenho escolar.",
          "É fácil! Você mostra seu boletim e, se estiver dentro dos critérios, ganha brindes, descontos ou até bolsas!"
        ]
      },
      {
        palavrasChave: ["comércios", "lojas", "parceiros", "onde usar"],
        respostas: [
          "Tem mercados, papelarias, lanchonetes e muito mais! A lista cresce o tempo todo!",
          "Os comércios parceiros incluem desde padarias até livrarias. Consulte no site a lista atualizada!",
          "Tem muita coisa legal! Já pensou ganhar um lanche só por ir bem na prova? 😄"
        ]
      },
      {
        palavrasChave: ["cadastro", "me cadastrar", "participar", "inscrição"],
        respostas: [
          "Você pode se cadastrar pela sua escola ou direto no nosso site. Pergunte para o coordenador escolar também!",
          "Fácil! Entre no site ou peça ajuda na sua escola. O cadastro é rápido!",
          "Procure a secretaria da sua escola ou acesse nosso portal. Estamos te esperando!"
        ]
      },
      {
        palavrasChave: ["exemplo", "história", "aluno", "funcionou"],
        respostas: [
          "Tem o caso da Júlia, que conseguiu um curso de inglês graças ao Nota Azul! Ela mandou super bem nas provas.",
          "Já tivemos alunos que ganharam bolsas de estudo e conseguiram seu primeiro estágio por causa da boa média escolar.",
          "Um aluno de São Gonçalo ganhou R$200 em descontos no mercado só com as notas do trimestre. 😲"
        ]
      },
      {
        palavrasChave: ["curiosidade", "sabia", "legal", "interessante"],
        respostas: [
          "Você sabia que mais de 15 mil alunos já participaram do projeto?",
          "Alguns comércios chegam a dar brindes personalizados para quem participa!",
          "O Nota Azul foi inspirado em um modelo educacional da Finlândia, mas adaptado à realidade local."
        ]
      },
      {
        palavrasChave: ["segurança", "dados", "privacidade"],
        respostas: [
          "Pode ficar tranquilo! Seus dados são protegidos e usados apenas para validar as notas e entregar os benefícios.",
          "A privacidade do aluno é uma prioridade no projeto. A média é validada, mas nunca exposta.",
          "Os dados são criptografados e só a equipe autorizada pode vê-los, e mesmo assim, apenas o necessário."
        ]
      },
      {
        palavrasChave: ["frase", "motivação", "motivar", "ânimo"],
        respostas: [
          "“O esforço de hoje é a recompensa de amanhã.” 💪",
          "“Estudar pode ser difícil, mas desistir não é opção.”",
          "“Cada nota azul é um passo mais perto dos seus sonhos!” ⭐"
        ]
      },
      {
        palavrasChave: ["parceria", "instituição", "empresa"],
        respostas: [
          "Temos parceria com instituições de ensino e empresas que acreditam no poder da educação.",
          "Se você representa uma empresa, entre em contato! Juntos podemos criar mais oportunidades.",
          "Comércio local + Educação = Transformação social. E você pode ser parte disso!"
        ]
      }
    ];
    
    function responderNotaAzul() {
        const entradaUsuario = document.getElementById('user-input').value.trim().toLowerCase();
        const caixaChat = document.getElementById('chat-box');
        caixaChat.innerHTML += `<div class="message user-message">${entradaUsuario}</div>`;
        caixaChat.innerHTML += `<div class="message bot-message">🤖 Azulzinho está pensando...</div>`;
        caixaChat.scrollTop = caixaChat.scrollHeight;
    
        setTimeout(() => {
            let respostaEncontrada = false;
    
            for (const grupo of respostasNotaAzul) {
                for (const palavra of grupo.palavrasChave) {
                    if (entradaUsuario.includes(palavra)) {
                        const respostaAleatoria = grupo.respostas[Math.floor(Math.random() * grupo.respostas.length)];
                        caixaChat.innerHTML += `<div class="message bot-message">${respostaAleatoria}</div>`;
                        respostaEncontrada = true;
                        break;
                    }
                }
                if (respostaEncontrada) break;
            }
    
            if (!respostaEncontrada) {
                caixaChat.innerHTML += `<div class="message bot-message">Hmm, não entendi bem 😕. Tente perguntar sobre o projeto, comércios, benefícios ou como funciona!</div>`;
            }
    
            caixaChat.scrollTop = caixaChat.scrollHeight;
            document.getElementById('user-input').value = '';
        }, 1200);
    }
    function mensagemBoasVindas() {
    const caixaChat = document.getElementById('chat-box');
    caixaChat.innerHTML += `<div class="message bot-message">Olá! 👋 Eu sou o <strong>Azulzinho 🤖</strong>, seu assistente do projeto <strong>Nota Azul</strong>! Pode me perguntar qualquer coisa sobre o programa. 🎓💙</div>`;
    caixaChat.scrollTop = caixaChat.scrollHeight;
  }
    
    document.getElementById('send-button').addEventListener('click', responderNotaAzul);
    document.getElementById('user-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            responderNotaAzul();
        }
    });
    </script>
    

</body>
</html>
